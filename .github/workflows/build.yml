name: Build Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform files
        run: flutter create . --platforms=android --org com.incomeweb3 --project-name teva

      - name: Turn off Android cloud backup (reinstall = fresh UID)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          if grep -q 'android:allowBackup' "$M"; then
            sed -i 's/android:allowBackup="[^"]*"/android:allowBackup="false"/' "$M"
          else
            sed -i 's/<application/<application android:allowBackup="false"/' "$M"
          fi
          grep -n 'allowBackup' "$M"

      - name: Set app name (shown under the icon)
        run: sed -i 's/android:label="[^"]*"/android:label="Tapca"/' android/app/src/main/AndroidManifest.xml

      - name: Disable release lint (avoids lint crash)
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            cat >> android/app/build.gradle.kts <<'EOF'

          android {
              lint {
                  checkReleaseBuilds = false
                  abortOnError = false
              }
          }
          EOF
          else
            cat >> android/app/build.gradle <<'EOF'

          android {
              lintOptions {
                  checkReleaseBuilds false
                  abortOnError false
              }
          }
          EOF
          fi

      - name: Set up release signing (upload key)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          if [ -f android/app/build.gradle.kts ]; then
            cat >> android/app/build.gradle.kts <<'EOF'

          android {
              signingConfigs {
                  create("release") {
                      storeFile = file(System.getenv("KEYSTORE_PATH"))
                      storePassword = System.getenv("KEYSTORE_PASSWORD")
                      keyAlias = "upload"
                      keyPassword = System.getenv("KEYSTORE_PASSWORD")
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          }
          EOF
          else
            cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("KEYSTORE_PATH"))
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias "upload"
                      keyPassword System.getenv("KEYSTORE_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF
          fi

      - run: flutter pub get

      - name: Build release APK (small, per CPU)
        run: flutter build apk --release --split-per-abi --build-number=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: teva-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Build release AAB
        continue-on-error: true
        run: flutter build appbundle --release --build-number=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: teva-aab
          if-no-files-found: warn
          path: build/app/outputs/bundle/release/app-release.aab
